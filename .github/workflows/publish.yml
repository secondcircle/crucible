# Every push to main that passes the checks becomes a release.
#
# The published artifact is platform-neutral — `out/` is JavaScript, and each
# machine's electron binary arrives through electron's own postinstall — so one
# Linux runner serves Mac, Windows and Linux alike.
#
# The version is decided here and never committed back: the repo's version is a
# floor the author raises by hand, and the registry is the record of what
# actually shipped.
name: publish

on:
  push:
    branches: [main]

# Two pushes in a minute must not race each other to the registry.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Full history: the comments rule's scenarios replay real commits from
      # this repository, and a shallow clone has none of them.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # electron's postinstall downloads a binary this job never runs. Nothing
      # here needs it.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # In order, cheapest failure first. A failure publishes nothing and the
      # version already on the registry stays current.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Choose the version to publish
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/publish-version.ts

      # Scoped packages default to private, and this one is public by ruling.
      #
      # The registry's `latest` lags a publish by minutes behind its CDN, so a
      # second push serialised behind a first can be told the version the first
      # just shipped is still free (run 35250112710 chose 0.1.22 two and a half
      # minutes after 0.1.22 landed). The PUT is the one answer that cannot be
      # stale: a 409 means step over that version and try again. Any other
      # failure is a failure.
      - name: Publish, stepping past a version the registry already holds
        run: |
          for attempt in 1 2 3; do
            if out=$(npm publish --access public 2>&1); then
              echo "$out"
              exit 0
            fi
            echo "$out"
            grep -q 'E409' <<<"$out" || exit 1
            npm version patch --no-git-tag-version
          done
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
