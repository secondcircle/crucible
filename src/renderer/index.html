<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      `frame-src exhibit:` is what admits the context panel's frame: an HTML
      exhibit loads from its own origin under its own policy, served by main,
      so this document's script-src is 'self' and nothing else.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src exhibit:"
    />
    <title>Crucible</title>
    <!--
      The window is created with this same background, so the document has no
      frame of white to show while the bundle loads.
    -->
    <style>
      html,
      body {
        background: #191419;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
