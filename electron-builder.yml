# Packaging for the installed app — the stable Crucible in the human's Dock.
# `npm run install:stable` is the only caller; there is no release pipeline.
appId: com.secondcircle.crucible
productName: Crucible
directories:
  output: dist
  buildResources: build
# No asar: the π SDK reads its own files (skills, prompts) off disk, and a
# plain directory keeps every such path ordinary.
asar: false
npmRebuild: false
files:
  - out/**
  - resources/**
mac:
  # A bare .app is all an install needs — no dmg, no zip, no signing identity
  # (electron-builder ad-hoc signs locally built apps).
  target: dir
  icon: build/icon.icns
  category: public.app-category.developer-tools
