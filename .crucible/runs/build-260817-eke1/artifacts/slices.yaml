slices:
  - id: scaffold-dev-loop
    goal: >
      Stand up the electron-vite scaffold and dev loop with a sandboxed window,
      and settle the remote-debugging-port facts.
    spec: [D2, D5, D10]
    after: null
    done:
      - "`npm run dev` opens the app with the renderer sandboxed (sandbox, contextIsolation, no nodeIntegration) and the bundled preload loading"
      - "an edit to the React tree hot-reloads in the running window, via the ELECTRON_RENDERER_URL load in `createMainWindow`"
      - "`agent-browser connect 9222` then `snapshot` attaches to the running app — either because electron-vite forwards the switch or because main sets it under a dev guard"
      - "`lsof -nP -iTCP:9222 -sTCP:LISTEN` output, and what a launch against an already-busy 9222 does, are recorded in the evidence file; port 9222 is documented in `AGENTS.md`"
      - "`npm run lint`, `npm run typecheck` and `npm test` all run and are green"

  - id: log-sink
    goal: >
      Build the log sink as the single writer of the run log, with a file
      adapter in the app and an in-memory adapter for tests.
    spec: [D9]
    after: scaffold-dev-loop
    done:
      - "after `npm run dev` and a quit, `logs/` holds one JSONL file for that launch whose lines carry ts, seq and source and show main's lifecycle in order"
      - "a unit test drives the in-memory sink and asserts sink-assigned sequence numbers on single-line records"
      - "with `logs/` deleted the app still starts: the sink creates it, and a sink that cannot write prints to stderr once while the app runs on"

  - id: agent-port-fake-pane
    goal: >
      Define the agent port types and build the fake adapter and chat pane
      against them, with no Electron involved.
    spec: [D1, D3, D4, D6, D10]
    after: log-sink
    done:
      - "`npm run dev` opens the app, a send renders the canned reply streaming in delta by delta, and send is disabled while the turn is live"
      - "a jsdom component test mounts the pane with the fake adapter passed as a prop and asserts the full turn_started → text_delta* → turn_ended sequence rendered, importing the reply constants from the fake's module"
      - "the port's type module is Crucible-owned TypeScript importing nothing, and no π SDK type appears in it"

  - id: renderer-import-fence
    goal: >
      Add the renderer import fence as an ESLint rule and prove it fires.
    spec: [D1, D4]
    after: agent-port-fake-pane
    done:
      - "`npm run lint` fails on a fixture renderer module that imports `@earendil-works/*`, and on a fixture that touches `window.crucible` outside `src/renderer/src/agent/ipc-client.ts`"
      - "with the fixtures removed `npm run lint` is green, and nothing in the app consumes the fence yet"

  - id: agent-channel
    goal: >
      Make the port work across the process boundary — preload surface,
      single-flight `agent:prompt` handler, `selectAdapter`, IPC client.
    spec: [D4, D5, D6, D7]
    after: renderer-import-fence
    done:
      - "an agent runs `npm run dev`, `agent-browser connect 9222`, `snapshot -i`, fills the input with \"Hello agent\", clicks send and `wait --text` sees the canned reply stream into the pane — no paid call anywhere"
      - "`mountApp` builds the IPC client and hands it to the pane; the pane still imports only the port"
      - "preload exposes exactly one `window.crucible.agent` object with `prompt` and `onEvent`, forwarding payloads only"
      - "a unit test on the handler with the fake adapter shows a prompt arriving mid-turn answered with turn_started then error code \"busy\" while the live turn runs on"
      - "reloading the window mid-turn disposes the turn, releases the guard, and the remounted pane starts empty and can prompt immediately"

  - id: logging-at-the-seam
    goal: >
      Wrap every selected adapter in `withLogging` and forward renderer console
      and preload errors into the same stream.
    spec: [D8, D9]
    after: agent-channel
    done:
      - "after a `npm run dev` session with one prompt, that launch's JSONL file shows main lifecycle, adapter identity, the prompt, every port event and a renderer console line in one order"
      - "renderer records carry `source: \"renderer\"` and main records `source: \"main\"`, so a reader can tell the two streams apart"
      - "a unit test drives `withLogging` over the fake adapter into the in-memory sink and asserts prompt, events and errors are recorded; no adapter references logging"
      - "a test asserts forwarded renderer console output lands in the in-memory sink"

  - id: sdk-adapter-and-proof
    goal: >
      Build the SDK adapter with `toPortEvent`, session disposal and the
      `dev:sdk` and `prove:sdk` scripts, and prove it once against the real SDK.
    spec: [D3, D5, D11, D12]
    after: logging-at-the-seam
    done:
      - "`npm run dev:sdk` shows the same pane driven by the real π SDK, with real model text streaming into it"
      - "a human runs `npm run prove:sdk` once, sees turn_started, at least one text_delta and turn_ended within 60s, and the stdout with model id and date is pasted into the evidence file"
      - "unit tests with the SDK stubbed cover `toPortEvent` (turn_start, text_delta, turn_end, error code \"adapter\") and show tool, compaction and retry events dropped"
      - "closing the window or quitting mid-turn disposes the SDK session, so no paid request is left running"
      - "`npm test` runs with credentials present and makes no network call: no test constructs the SDK adapter"
